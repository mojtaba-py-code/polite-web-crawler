name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test & security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (strict type-check)
        run: mypy src

      # The 80% floor lives in [tool.coverage.report] in pyproject.toml, so a local
      # `pytest` enforces exactly what CI does. Under the floor, this step fails.
      - name: Pytest (coverage floor enforced)
        run: pytest --cov=politecrawl --cov-report=term-missing

      - name: Bandit (security scan)
        run: bandit -c pyproject.toml -r src --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: |
          python -m pip install --upgrade setuptools pip-audit
          pip-audit --skip-editable --progress-spinner off
